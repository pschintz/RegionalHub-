t-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-700 text-white p-4 sticky top-0 z-50 shadow">
    <div class="max-w-lg mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold">Regional Hub</h1>
        <p class="text-xs text-indigo-200">GA • SC • NC</p>
      </div>
      <button onclick="showSummary()" class="bg-white text-indigo-700 text-sm font-medium px-3 py-1.5 rounded-lg">
        Export Week
      </button>
    </div>
  </header>

  <main class="max-w-lg mx-auto p-4 space-y-5 pb-28">

    <!-- Week Navigation -->
    <div class="flex items-center justify-between bg-white rounded-xl p-3 shadow-sm border">
      <button onclick="changeWeek(-1)" class="text-indigo-600 font-medium px-3 py-1">← Prev</button>
      <div class="text-center">
        <div class="font-semibold" id="weekLabel">This Week</div>
        <div class="text-xs text-slate-500" id="weekRange"></div>
      </div>
      <button onclick="changeWeek(1)" class="text-indigo-600 font-medium px-3 py-1">Next →</button>
    </div>

    <!-- Days -->
    <div id="daysContainer" class="space-y-4"></div>

  </main>

  <!-- Summary Modal -->
  <div id="summaryModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl">
      <h3 class="font-bold text-lg mb-3">Week Summary</h3>
      <pre id="summaryText" class="text-sm bg-slate-50 p-3 rounded-lg mb-4 whitespace-pre-wrap max-h-64 overflow-y-auto"></pre>
      <div class="flex gap-2">
        <button onclick="copySummary()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-medium">Copy</button>
        <button onclick="hideSummary()" class="flex-1 bg-slate-200 py-2.5 rounded-lg font-medium">Close</button>
      </div>
    </div>
  </div>

  <script>
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let currentMonday = getMonday(new Date());

    // ----- Helpers -----
    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function formatDate(date) {
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function dateKey(date) {
      return date.toISOString().split('T')[0];
    }

    function isToday(date) {
      const today = new Date();
      return dateKey(date) === dateKey(today);
    }

    // ----- Data -----
    let trips = JSON.parse(localStorage.getItem('trips') || '{}');
    let savedOffices = JSON.parse(localStorage.getItem('savedOffices') || '[]');
    let savedHotels = JSON.parse(localStorage.getItem('savedHotels') || '[]');

    function saveAll() {
      localStorage.setItem('trips', JSON.stringify(trips));
      localStorage.setItem('savedOffices', JSON.stringify(savedOffices));
      localStorage.setItem('savedHotels', JSON.stringify(savedHotels));
    }

    function getDayData(date) {
      const key = dateKey(date);
      if (!trips[key]) trips[key] = { city: '', officeAddress: '', hotel: '', hotelAddress: '' };
      return trips[key];
    }

    function rememberOffice(city, address) {
      if (!city) return;
      const exists = savedOffices.find(o => o.city.toLowerCase() === city.toLowerCase());
      if (exists) {
        if (address) exists.address = address;
      } else {
        savedOffices.push({ city, address: address || '' });
      }
    }

    function rememberHotel(name, address) {
      if (!name) return;
      const exists = savedHotels.find(h => h.name.toLowerCase() === name.toLowerCase());
      if (exists) {
        if (address) exists.address = address;
      } else {
        savedHotels.push({ name, address: address || '' });
      }
    }

    // ----- Render -----
    function renderWeek() {
      const container = document.getElementById('daysContainer');
      container.innerHTML = '';

      const start = new Date(currentMonday);
      const end = new Date(currentMonday);
      end.setDate(end.getDate() + 6);

      document.getElementById('weekRange').textContent = `${formatDate(start)} – ${formatDate(end)}`;

      const today = new Date();
      const thisMonday = getMonday(today);
      document.getElementById('weekLabel').textContent = 
        dateKey(currentMonday) === dateKey(thisMonday) ? 'This Week' : 'Selected Week';

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);
        const data = getDayData(date);
        const key = dateKey(date);
        const dayName = dayNames[date.getDay()];
        const dateStr = formatDate(date);
        const todayLabel = isToday(date) ? ' <span class="text-indigo-600 font-normal">(Today)</span>' : '';

        // Previous day hotel for directions
        let prevHotelAddress = '';
        if (i > 0) {
          const prevDate = new Date(currentMonday);
          prevDate.setDate(prevDate.getDate() + i - 1);
          prevHotelAddress = getDayData(prevDate).hotelAddress || '';
        }

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-4';
        card.innerHTML = `
          <div class="font-medium text-indigo-700 mb-3">${dayName}, ${dateStr}${todayLabel}</div>

          <div class="space-y-3 text-sm">
            <!-- City / Office -->
            <div>
              <label class="text-xs text-slate-500">City / Office</label>
              <input list="officeSuggestions" type="text" value="${data.city}"
                     onchange="updateField('${key}', 'city', this.value)"
                     placeholder="e.g. Charlotte"
                     class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
              <label class="text-xs text-slate-500">Office Address</label>
              <div class="flex gap-2 mt-1">
                <input type="text" value="${data.officeAddress}"
                       onchange="updateField('${key}', 'officeAddress', this.value)"
                       placeholder="Street address"
                       class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                ${data.officeAddress ? `
                  <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.officeAddress)}" 
                     target="_blank"
                     class="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center">Maps</a>
                ` : ''}
              </div>
            </div>

            <!-- Hotel -->
            <div>
              <label class="text-xs text-slate-500">Hotel</label>
              <input list="hotelSuggestions" type="text" value="${data.hotel}"
                     onchange="updateField('${key}', 'hotel', this.value)"
                     placeholder="e.g. The Dunhill"
                     class="w-full mt-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
              <label class="text-xs text-slate-500">Hotel Address</label>
              <div class="flex gap-2 mt-1">
                <input type="text" value="${data.hotelAddress}"
                       onchange="updateField('${key}', 'hotelAddress', this.value)"
                       placeholder="Street address"
                       class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                ${data.hotelAddress ? `
                  <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.hotelAddress)}" 
                     target="_blank"
                     class="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center">Maps</a>
                ` : ''}
              </div>
            </div>

            <!-- Directions from previous hotel -->
            ${prevHotelAddress && data.officeAddress ? `
              <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(prevHotelAddress)}&destination=${encodeURIComponent(data.officeAddress)}" 
                 target="_blank"
                 class="block text-center bg-emerald-50 text-emerald-700 border border-emerald-200 py-2 rounded-lg text-sm font-medium mt-1">
                Directions from previous hotel
              </a>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      }

      // Update suggestion lists
      updateSuggestions();
    }

    function updateField(key, field, value) {
      if (!trips[key]) trips[key] = { city: '', officeAddress: '', hotel: '', hotelAddress: '' };
      trips[key][field] = value;

      // Remember for suggestions
      if (field === 'city' || field === 'officeAddress') {
        rememberOffice(trips[key].city, trips[key].officeAddress);
      }
      if (field === 'hotel' || field === 'hotelAddress') {
        rememberHotel(trips[key].hotel, trips[key].hotelAddress);
      }

      saveAll();
      renderWeek(); // re-render to show/hide Maps buttons
    }

    function updateSuggestions() {
      // Office suggestions
      let officeList = document.getElementById('officeSuggestions');
      if (!officeList) {
        officeList = document.createElement('datalist');
        officeList.id = 'officeSuggestions';
        document.body.appendChild(officeList);
      }
      officeList.innerHTML = savedOffices.map(o => 
        `<option value="${o.city}">${o.address ? o.address : ''}</option>`
      ).join('');

      // Hotel suggestions
      let hotelList = document.getElementById('hotelSuggestions');
      if (!hotelList) {
        hotelList = document.createElement('datalist');
        hotelList.id = 'hotelSuggestions';
        document.body.appendChild(hotelList);
      }
      hotelList.innerHTML = savedHotels.map(h => 
        `<option value="${h.name}">${h.address ? h.address : ''}</option>`
      ).join('');
    }

    function changeWeek(offset) {
      currentMonday.setDate(currentMonday.getDate() + (offset * 7));
      renderWeek();
    }

    // ----- Export -----
    function showSummary() {
      let text = 'Travel this week:\n\n';
      let hasData = false;

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);
        const data = getDayData(date);
        const dayName = dayNames[date.getDay()];
        const dateStr = formatDate(date);

        if (data.city || data.hotel) {
          hasData = true;
          text += `${dayName}, ${dateStr}`;
          if (data.city) text += ` – ${data.city}`;
          text += '\n';
          if (data.hotel) text += `Hotel: ${data.hotel}\n`;
          if (data.hotelAddress) text += `${data.hotelAddress}\n`;
          text += '\n';
        }
      }

      if (!hasData) text = 'No travel details entered for this week yet.';

      document.getElementById('summaryText').textContent = text.trim();
      document.getElementById('summaryModal').classList.remove('hidden');
      document.getElementById('summaryModal').classList.add('flex');
    }

    function hideSummary() {
      document.getElementById('summaryModal').classList.add('hidden');
      document.getElementById('summaryModal').classList.remove('flex');
    }

    function copySummary() {
      const text = document.getElementById('summaryText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied! You can now paste it into Messages.');
      });
    }

    // Start
    renderWeek();
  </script>
</body>
</html>
