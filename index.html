<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Regional Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f1f5f9; color: #1e2937; }
    header { background: #4338ca; color: white; padding: 16px; position: sticky; top: 0; z-index: 50; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px 16px 100px; }
    .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px; overflow: hidden; }
    .card-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 0 16px 16px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 4px; font-size: 14px; }
    label { font-size: 12px; color: #64748b; display: block; margin-top: 8px; }
    .btn { background: #4f46e5; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .btn-light { background: white; color: #4f46e5; border: 1px solid #c7d2fe; }
    .expand { display: none; background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 16px; }
    .expand.open { display: block; }
    .week-nav { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .calendar { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-day { padding: 8px 4px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: white; border-radius: 16px; padding: 20px; max-width: 380px; width: 100%; }
    .link { font-size: 12px; color: #4f46e5; margin-right: 8px; text-decoration: none; }
    .maps-btn { display: inline-block; background: #eef2ff; color: #4f46e5; padding: 6px 10px; border-radius: 6px; font-size: 12px; text-decoration: none; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <div style="max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-weight:700;font-size:18px;">Regional Hub</div>
        <div style="font-size:12px;opacity:0.8;">NC • SC • GA</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-light" onclick="toggleCalendar()">Calendar</button>
        <button class="btn btn-light" onclick="showSummary()">Export Week</button>
      </div>
    </div>
  </header>

  <div class="container">

    <div id="calendarView" class="calendar" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <button class="btn btn-light" onclick="changeMonth(-1)">←</button>
        <strong id="calendarTitle"></strong>
        <button class="btn btn-light" onclick="changeMonth(1)">→</button>
      </div>
      <div class="cal-grid" style="font-size:12px;color:#64748b;margin-bottom:4px;">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
      </div>
      <div id="calendarDays" class="cal-grid"></div>
      <div style="display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:12px;">
        <span><span style="display:inline-block;width:12px;height:12px;background:#bbf7d0;border-radius:3px;"></span> Visit</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:#fed7aa;border-radius:3px;"></span> Open</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:#bfdbfe;border-radius:3px;"></span> Off</span>
      </div>
    </div>

    <div class="week-nav">
      <button class="btn btn-light" onclick="changeWeek(-1)">← Prev</button>
      <div style="text-align:center;">
        <div style="font-weight:600;" id="weekLabel">This Week</div>
        <div style="font-size:12px;color:#64748b;" id="weekRange"></div>
      </div>
      <button class="btn btn-light" onclick="changeWeek(1)">Next →</button>
    </div>

    <div id="daysContainer"></div>
  </div>

  <div id="summaryModal" class="modal">
    <div class="modal-content">
      <h3 style="margin:0 0 12px;">Week Summary</h3>
      <pre id="summaryText" style="background:#f8fafc;padding:12px;border-radius:8px;font-size:13px;white-space:pre-wrap;max-height:240px;overflow:auto;"></pre>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn" style="flex:1;" onclick="copySummary()">Copy</button>
        <button class="btn btn-light" style="flex:1;" onclick="hideSummary()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let currentMonday = getMonday(new Date());
    let calendarDate = new Date();

    const merrillOffices = [
      {city:"Charlotte",state:"NC",name:"Charlotte-Ballantyne",address:"13510 Ballantyne Corporate Pl, Charlotte, NC 28277",phone:"704.341.5100"},
      {city:"Charlotte",state:"NC",name:"Charlotte Uptown",address:"620 S Tryon St, Charlotte, NC 28255",phone:"704.339.2000"},
      {city:"Charlotte",state:"NC",name:"Charlotte Fairview",address:"6000 Fairview Rd, Charlotte, NC 28210",phone:"980.282.1700"},
      {city:"Raleigh",state:"NC",name:"Raleigh",address:"4242 Six Forks Rd, Raleigh, NC 27609",phone:"919.829.2000"},
      {city:"Greensboro",state:"NC",name:"Greensboro",address:"800 Green Valley Rd, Suite 400, Greensboro, NC 27408",phone:"336.574.8200"},
      {city:"Winston-Salem",state:"NC",name:"Winston-Salem",address:"380 Knollwood St, Winston-Salem, NC 27103",phone:"336.721.3200"},
      {city:"Columbia",state:"SC",name:"Columbia",address:"1333 Main St, Columbia, SC 29201",phone:"803.343.6100"},
      {city:"Charleston",state:"SC",name:"Charleston",address:"17 Lockwood Dr, Charleston, SC 29401",phone:"843.579.6100"},
      {city:"Greenville",state:"SC",name:"Greenville",address:"55 Beattie Pl, Greenville, SC 29601",phone:"864.239.2400"},
      {city:"Myrtle Beach",state:"SC",name:"Myrtle Beach",address:"2024 Corporate Centre Dr, Myrtle Beach, SC 29577",phone:"843.946.2000"},
      {city:"Atlanta",state:"GA",name:"Atlanta Buckhead",address:"3455 Peachtree Rd NE, Atlanta, GA 30326",phone:"404.264.1000"},
      {city:"Alpharetta",state:"GA",name:"Alpharetta",address:"10000 Avalon Blvd, Alpharetta, GA 30009",phone:"770.360.6000"},
      {city:"Duluth",state:"GA",name:"Duluth",address:"2170 Satellite Blvd, Duluth, GA 30097",phone:"678.474.1800"},
      {city:"Gainesville",state:"GA",name:"Gainesville",address:"340 Jesse Jewell Pkwy SE, Gainesville, GA 30501",phone:"770.287.1800"}
    ];

    function getMonday(d){d=new Date(d);const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);return new Date(d.setDate(diff));}
    function formatDate(date){return date.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
    function dateKey(date){return date.toISOString().split('T')[0];}
    function isToday(date){return dateKey(date)===dateKey(new Date());}

    let trips = JSON.parse(localStorage.getItem('trips')||'{}');
    let preferredHotels = JSON.parse(localStorage.getItem('preferredHotels')||'{}');

    function saveAll(){localStorage.setItem('trips',JSON.stringify(trips));localStorage.setItem('preferredHotels',JSON.stringify(preferredHotels));}

    function getDayData(date){
      const key=dateKey(date);
      if(!trips[key]) trips[key]={city:'',officeAddress:'',phone:'',hotel:'',hotelAddress:'',status:'open'};
      return trips[key];
    }

    function getLastVisits(city){
      if(!city) return [];
      return Object.entries(trips)
        .filter(([k,v])=>v.city&&v.city.toLowerCase()===city.toLowerCase()&&v.status!=='off')
        .map(([k])=>k).sort().slice(-5).reverse();
    }

    function renderWeek(){
      const container=document.getElementById('daysContainer');
      container.innerHTML='';
      const start=new Date(currentMonday);
      const end=new Date(currentMonday);end.setDate(end.getDate()+6);
      document.getElementById('weekRange').textContent=`${formatDate(start)} – ${formatDate(end)}`;
      document.getElementById('weekLabel').textContent=dateKey(currentMonday)===dateKey(getMonday(new Date()))?'This Week':'Selected Week';

      for(let i=0;i<7;i++){
        const date=new Date(currentMonday);date.setDate(date.getDate()+i);
        const data=getDayData(date);
        const key=dateKey(date);
        const todayLabel=isToday(date)?' <span style="color:#4f46e5;">(Today)</span>':'';
        const lastVisits=getLastVisits(data.city);

        let prevHotel='';
        if(i>0){
          const prev=new Date(currentMonday);prev.setDate(prev.getDate()+i-1);
          prevHotel=getDayData(prev).hotelAddress||'';
        }

        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`
          <div class="card-header">
            <div style="font-weight:600;color:#4338ca;">${dayNames[date.getDay()]}, ${formatDate(date)}${todayLabel}</div>
            <button onclick="toggleExpand('${key}')" style="background:none;border:none;font-size:20px;color:#94a3b8;">›</button>
          </div>
          <div class="card-body">
            <label>City / Office</label>
            <input list="officeList" value="${data.city}" onchange="updateField('${key}','city',this.value)" placeholder="e.g. Charlotte">
            <label>Office Address</label>
            <div style="display:flex;gap:6px;align-items:center;">
              <input style="flex:1;" value="${data.officeAddress}" onchange="updateField('${key}','officeAddress',this.value)" placeholder="Street address">
              ${data.officeAddress?`<a class="maps-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.officeAddress)}" target="_blank">Maps</a>`:''}
            </div>
            <label>Hotel</label>
            <input list="hotelList" value="${data.hotel}" onchange="updateField('${key}','hotel',this.value)" placeholder="e.g. Courtyard">
            <label>Hotel Address</label>
            <div style="display:flex;gap:6px;align-items:center;">
              <input style="flex:1;" value="${data.hotelAddress}" onchange="updateField('${key}','hotelAddress',this.value)" placeholder="Street address">
              ${data.hotelAddress?`<a class="maps-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.hotelAddress)}" target="_blank">Maps</a>`:''}
            </div>
          </div>
          <div id="exp-${key}" class="expand">
            <div style="display:flex;gap:6px;margin-bottom:12px;font-size:12px;">
              <button onclick="setStatus('${key}','open')" style="padding:4px 8px;border-radius:6px;border:1px solid #e2e8f0;${data.status==='open'?'background:#fed7aa':''}">Open</button>
              <button onclick="setStatus('${key}','visit')" style="padding:4px 8px;border-radius:6px;border:1px solid #e2e8f0;${data.status==='visit'?'background:#bbf7d0':''}">Visit</button>
              <button onclick="setStatus('${key}','off')" style="padding:4px 8px;border-radius:6px;border:1px solid #e2e8f0;${data.status==='off'?'background:#bfdbfe':''}">Off</button>
            </div>
            ${lastVisits.length?`<div style="font-size:12px;color:#64748b;margin-bottom:8px;">Last visits: ${lastVisits.map(d=>formatDate(new Date(d+'T12:00:00'))).join(', ')}</div>`:''}
            ${data.city?`<div style="margin-bottom:8px;"><a class="link" href="https://www.google.com/search?q=restaurants+near+${encodeURIComponent(data.city)}" target="_blank">Restaurants</a><a class="link" href="https://www.google.com/search?q=bbq+near+${encodeURIComponent(data.city)}" target="_blank">BBQ</a><a class="link" href="https://www.google.com/search?q=breweries+near+${encodeURIComponent(data.city)}" target="_blank">Breweries</a></div>`:''}
            ${prevHotel&&data.officeAddress?`<a class="link" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(prevHotel)}&destination=${encodeURIComponent(data.officeAddress)}" target="_blank">Directions from previous hotel</a>`:''}
          </div>
        `;
        container.appendChild(card);
      }
      updateDatalists();
    }

    function updateField(key,field,value){
      if(!trips[key]) trips[key]={city:'',officeAddress:'',phone:'',hotel:'',hotelAddress:'',status:'open'};
      trips[key][field]=value;

      if(field==='city'){
        const match=merrillOffices.find(o=>o.city.toLowerCase()===value.toLowerCase()||o.name.toLowerCase().includes(value.toLowerCase()));
        if(match){
          trips[key].officeAddress=match.address;
          trips[key].phone=match.phone;
          trips[key].city=match.city;
        }
        const pref=preferredHotels[value.toLowerCase()];
        if(pref){
          trips[key].hotel=pref.name||'';
          trips[key].hotelAddress=pref.address||'';
        }
      }

      if(field==='hotel'&&trips[key].city){
        preferredHotels[trips[key].city.toLowerCase()]={
          name:value,
          address:trips[key].hotelAddress||''
        };
      }
      if(field==='hotelAddress'&&trips[key].city&&trips[key].hotel){
        preferredHotels[trips[key].city.toLowerCase()]={
          name:trips[key].hotel,
          address:value
        };
      }

      if(trips[key].city||trips[key].hotel) trips[key].status='visit';
      saveAll();
      renderWeek();
    }

    function setStatus(key,status){
      if(!trips[key]) trips[key]={city:'',officeAddress:'',phone:'',hotel:'',hotelAddress:'',status};
      trips[key].status=status;saveAll();renderWeek();renderCalendar();
    }

    function toggleExpand(key){document.getElementById('exp-'+key).classList.toggle('open');}

    function updateDatalists(){
      let list=document.getElementById('officeList');
      if(!list){list=document.createElement('datalist');list.id='officeList';document.body.appendChild(list);}
      const offices=[...new Set([...merrillOffices.map(o=>o.city),...Object.values(trips).map(t=>t.city).filter(Boolean)])];
      list.innerHTML=offices.map(c=>`<option value="${c}">`).join('');

      let hlist=document.getElementById('hotelList');
      if(!hlist){hlist=document.createElement('datalist');hlist.id='hotelList';document.body.appendChild(hlist);}
      const hotels=[...new Set(Object.values(trips).map(t=>t.hotel).filter(Boolean))];
      hlist.innerHTML=hotels.map(h=>`<option value="${h}">`).join('');
    }

    function changeWeek(offset){currentMonday.setDate(currentMonday.getDate()+offset*7);renderWeek();}

    function toggleCalendar(){
      const el=document.getElementById('calendarView');
      el.style.display=el.style.display==='none'?'block':'none';
      if(el.style.display==='block') renderCalendar();
    }
    function changeMonth(offset){calendarDate.setMonth(calendarDate.getMonth()+offset);renderCalendar();}
    function renderCalendar(){
      document.getElementById('calendarTitle').textContent=calendarDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      const year=calendarDate.getFullYear(),month=calendarDate.getMonth();
      const firstDay=new Date(year,month,1).getDay();
      const daysInMonth=new Date(year,month+1,0).getDate();
      let html='';
      for(let i=0;i<firstDay;i++) html+='<div></div>';
      for(let d=1;d<=daysInMonth;d++){
        const date=new Date(year,month,d);
        const key=dateKey(date);
        const data=trips[key]||{};
        let bg='#fed7aa';
        if(data.status==='visit'||data.city) bg='#bbf7d0';
        if(data.status==='off') bg='#bfdbfe';
        html+=`<div class="cal-day" onclick="jumpToDate('${key}')" style="background:${bg};">${d}</div>`;
      }
      document.getElementById('calendarDays').innerHTML=html;
    }
    function jumpToDate(key){
      currentMonday=getMonday(new Date(key+'T12:00:00'));
      document.getElementById('calendarView').style.display='none';
      renderWeek();
    }

    function showSummary(){
      let text='Travel this week:\n\n';let has=false;
      for(let i=0;i<7;i++){
        const date=new Date(currentMonday);date.setDate(date.getDate()+i);
        const data=getDayData(date);
        if(data.city||data.hotel||data.status==='off'){
          has=true;
          text+=`${dayNames[date.getDay()]}, ${formatDate(date)}`;
          if(data.status==='off') text+=' – Off';
          else if(data.city) text+=` – ${data.city}`;
          text+='\n';
          if(data.hotel) text+=`Hotel: ${data.hotel}\n`;
          text+='\n';
        }
      }
      document.getElementById('summaryText').textContent=has?text.trim():'No details for this week.';
      document.getElementById('summaryModal').classList.add('open');
    }
    function hideSummary(){document.getElementById('summaryModal').classList.remove('open');}
    function copySummary(){navigator.clipboard.writeText(document.getElementById('summaryText').textContent).then(()=>alert('Copied'));}

    renderWeek();
  </script>
</body>
</html>
